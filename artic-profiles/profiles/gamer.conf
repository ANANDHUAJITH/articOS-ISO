## articOs Profile: gamer
## Gaming-optimised — Wine, Proton, performance tweaks

DESCRIPTION="Gamer — Steam, Lutris, Wine, GameMode, low-latency zen tweaks"
ICON="🎮"

PACMAN_PACKAGES=(
    # Steam & native gaming
    steam
    lib32-mesa lib32-vulkan-radeon lib32-vulkan-intel
    lib32-nvidia-utils
    vulkan-tools vulkan-icd-loader
    # Wine (full)
    wine-staging
    winetricks
    wine-mono wine-gecko
    # Performance
    gamemode lib32-gamemode
    mangohud lib32-mangohud
    gamescope
    # Audio for games
    lib32-pipewire lib32-libpulse
    # Controller support
    joystick jstest-gtk
    antimicrox
    xboxdrv
    # Emulators
    retroarch
    dolphin-emu
    # Utilities
    goverlay
    discord
)

AUR_PACKAGES=(
    lutris
    heroic-games-launcher-bin
    protonup-qt
    bottles
    protontricks
    sc-controller
    input-remapper-git
    amdgpu-pro-vulkan
    vkbasalt
    latencyflex-git
)

FLATPAK_APPS=(
    com.discordapp.Discord
    net.davidotek.pupgui2
    com.usebottles.bottles
)

SERVICES_ENABLE=(
    gamemode
)

## Low-latency kernel tweaks for linux-zen
SYSCTL_SETTINGS=(
    "vm.swappiness=1"
    "kernel.sched_latency_ns=4000000"
    "kernel.sched_min_granularity_ns=500000"
    "kernel.sched_wakeup_granularity_ns=1000000"
    "vm.dirty_ratio=3"
    "vm.dirty_background_ratio=2"
    "net.core.netdev_max_backlog=16384"
)

ARTIC_ENV=(
    "export DXVK_ASYNC=1"
    "export PROTON_NO_ESYNC=0"
    "export PROTON_ENABLE_NVAPI=1"
    "export __GL_THREADED_OPTIMIZATIONS=1"
    "export MANGOHUD=1"
    "alias game='gamemoderun'"
)

POST_INSTALL_SCRIPT="/etc/artic/hooks/gamer-post.sh"
