## articOs Profile: home
## Everyday general-purpose desktop environment

DESCRIPTION="Home User — browser, office, media, communication"
ICON="🏠"

PACMAN_PACKAGES=(
    # Browsers
    firefox chromium
    # Office
    libreoffice-fresh
    thunderbird
    # Media
    vlc
    spotify-launcher
    gimp inkscape
    # Communication
    telegram-desktop
    # PDF
    evince
    # Notes
    xournalpp
    # Password manager
    keepassxc
    # Cloud
    nextcloud-client
    # Fonts
    ttf-liberation ttf-dejavu
    # Misc
    redshift
    simple-scan
)

AUR_PACKAGES=(
    google-chrome
    zoom
    slack-desktop
    obsidian
    notion-app-enhanced
    timeshift-autosnap
    pamac-aur
)

FLATPAK_APPS=(
    org.mozilla.firefox
    org.libreoffice.LibreOffice
    org.videolan.VLC
    org.telegram.desktop
    org.keepassxc.KeePassXC
    com.spotify.Client
)

SERVICES_ENABLE=(
    cups
    bluetooth
    timeshift-autobackup
)

SYSCTL_SETTINGS=(
    "vm.swappiness=10"
    "vm.vfs_cache_pressure=50"
)

ARTIC_ENV=(
    "export BROWSER=firefox"
)
