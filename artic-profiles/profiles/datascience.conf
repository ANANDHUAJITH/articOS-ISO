## articOs Profile: datascience
## ML, AI, data analysis, Jupyter, CUDA

DESCRIPTION="Data Scientist / ML Engineer — Python ML stack, Jupyter, CUDA"
ICON="🧠"

PACMAN_PACKAGES=(
    python
    python-pip
    python-numpy
    python-scipy
    python-matplotlib
    python-pandas
    python-scikit-learn
    python-pillow
    python-requests
    python-sqlalchemy
    jupyter
    jupyter-notebook
    r
    cuda           # requires nvidia GPU
    cudnn
    git
    cmake
    gcc
    htop
    nvtop
    postgresql
)

AUR_PACKAGES=(
    python-torch-cuda
    python-tensorflow-cuda
    jupyterlab
    dbeaver
    rstudio-desktop-bin
    conda
)

FLATPAK_APPS=(
    io.dbeaver.DBeaverCommunity
)

SERVICES_ENABLE=(
    postgresql
)

SYSCTL_SETTINGS=(
    "vm.swappiness=5"
    "kernel.perf_event_paranoid=1"
    "vm.overcommit_memory=1"   # needed for pytorch/tensorflow
)

ARTIC_ENV=(
    "export CUDA_HOME=/opt/cuda"
    "export PATH=\$PATH:\$CUDA_HOME/bin"
    "export LD_LIBRARY_PATH=\$LD_LIBRARY_PATH:\$CUDA_HOME/lib64"
    "export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512"
    "alias jl='jupyter lab'"
    "alias jn='jupyter notebook'"
)
