## articOs Profile: minimal
## Stripped-down base — for servers, containers, or power users who want control

DESCRIPTION="Minimal — no GUI extras, just a tight base. Add what you need."
ICON="⚡"

PACMAN_PACKAGES=(
    neovim
    tmux
    zsh
    git
    curl wget
    htop btop
    ripgrep fd bat eza
    fzf
    jq yq
    rsync
    openssh
    ufw
    python python-pip
    go
    netcat socat
    strace tcpdump
)

AUR_PACKAGES=(
    lazygit
    zoxide
    starship
)

FLATPAK_APPS=()
APT_IN_BOX=()

SERVICES_ENABLE=(
    ufw
    sshd
)

SERVICES_DISABLE=(
    bluetooth
    cups
    avahi-daemon
    ModemManager
)

SYSCTL_SETTINGS=(
    "vm.swappiness=1"
    "net.ipv4.tcp_fastopen=3"
    "net.core.somaxconn=65535"
    "net.ipv4.tcp_max_syn_backlog=65535"
    "net.ipv4.ip_local_port_range=1024 65535"
)

ARTIC_ENV=(
    "export EDITOR=nvim"
    "export VISUAL=nvim"
)
