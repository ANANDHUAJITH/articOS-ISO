## articOs Profile: dev
## Full software development environment

DESCRIPTION="Software Developer — compilers, LSPs, containers, IDEs"
ICON="💻"

## Packages from official repos
PACMAN_PACKAGES=(
    # Core dev tools
    git git-lfs github-cli
    base-devel cmake ninja meson
    clang llvm lldb lld
    rustup go python python-pip python-virtualenv
    nodejs npm yarn
    jdk-openjdk
    lua lua-language-server
    perl ruby
    # LSPs & editors
    neovim
    python-pynvim
    tree-sitter
    # Debugging
    gdb valgrind strace ltrace
    perf linux-zen-tools
    # Containers & orchestration
    docker docker-compose
    kubectl helm
    # DB tools
    postgresql-libs sqlite
    # Networking
    httpie netcat socat
    # TUI dev tools
    lazygit delta tig
    tokei hyperfine
    # Documentation
    doxygen graphviz plantuml
    pandoc
)

## AUR packages
AUR_PACKAGES=(
    visual-studio-code-bin
    jetbrains-toolbox
    python-poetry
    fnm-bin
    dbeaver
    insomnia-bin
    zellij
    bob-nvim
)

## Flatpak apps (sandboxed)
FLATPAK_APPS=(
    com.getpostman.Postman
    io.dbeaver.DBeaverCommunity
)

## Services to enable
SERVICES_ENABLE=(
    docker
    postgresql
)

## Sysctl: kernel tuning for build performance
SYSCTL_SETTINGS=(
    "vm.swappiness=10"
    "kernel.perf_event_paranoid=1"
    "fs.inotify.max_user_watches=524288"
    "kernel.dmesg_restrict=0"
)

## Environment variables written to ~/.config/artic/profile.env
ARTIC_ENV=(
    "export EDITOR=nvim"
    "export VISUAL=nvim"
    "export GOPATH=\$HOME/go"
    "export PATH=\$PATH:\$GOPATH/bin:\$HOME/.cargo/bin:\$HOME/.local/bin"
    "export DOCKER_BUILDKIT=1"
    "export COMPOSE_DOCKER_CLI_BUILD=1"
)

## Post-install script
POST_INSTALL_SCRIPT="/etc/artic/hooks/dev-post.sh"
