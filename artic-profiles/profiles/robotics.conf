## articOs Profile: robotics
## ROS 2, embedded dev, simulation, hardware interface

DESCRIPTION="Robotics Engineer — ROS2, Gazebo, Arduino, FPGA, real-time kernel"
ICON="🤖"

PACMAN_PACKAGES=(
    # Core build
    cmake ninja meson
    gcc clang arm-none-eabi-gcc
    avrdude
    openocd
    # Python
    python python-pip
    python-numpy python-scipy
    python-matplotlib python-pandas
    python-opencv
    python-serial
    # CAN / hardware buses
    can-utils
    # Simulation
    # (Gazebo & ROS2 from AUR/custom repo)
    # Real-time & hardware
    rtkit
    # USB/Serial
    usbutils
    # Networking
    nmap socat
    # Visualisation
    gnuplot
    # Embedded IDEs
    code
    # FPGA toolchain (open source)
    yosys
    nextpnr
)

AUR_PACKAGES=(
    ros2-humble-desktop          # ROS 2 Humble via AUR
    gazebo-harmonic
    arduino-ide-bin
    platformio-core
    stm32cubemx
    kicad
    freecad
    openscad
)

APT_IN_BOX=(
    # Run inside Ubuntu container via artic-box for ROS apt packages
    ros-humble-rviz2
    ros-humble-nav2-bringup
    ros-humble-moveit
    python3-colcon-common-extensions
)

SERVICES_ENABLE=(
    rtkit-daemon
    udevd
)

## Real-time sysctl for low-latency hardware loops
SYSCTL_SETTINGS=(
    "kernel.sched_rt_runtime_us=-1"         # allow full RT scheduling
    "vm.swappiness=1"
    "kernel.perf_event_paranoid=-1"
    "kernel.yama.ptrace_scope=0"
    "fs.inotify.max_user_watches=524288"
)

ARTIC_ENV=(
    "source /opt/ros/humble/setup.zsh 2>/dev/null || true"
    "export ROS_DOMAIN_ID=42"
    "export GAZEBO_MODEL_PATH=\$HOME/ros2_ws/models"
    "export PYTHONPATH=\$PYTHONPATH:/opt/ros/humble/lib/python3/dist-packages"
    "alias cb='cd ~/ros2_ws && colcon build --symlink-install'"
    "alias sr='source ~/ros2_ws/install/setup.zsh'"
)

POST_INSTALL_SCRIPT="/etc/artic/hooks/robotics-post.sh"
