## articOs Profile: hacker
## Offensive security, CTF, and pentesting tools
## NOTE: These tools are for authorised testing only.

DESCRIPTION="Security Researcher / Pentester / CTF — offensive & defensive tools"
ICON="🔐"

PACMAN_PACKAGES=(
    # Network analysis
    nmap masscan tcpdump wireshark-qt
    ettercap dsniff arpwatch
    # Web
    sqlmap nikto dirb
    # Exploitation
    metasploit
    gdb pwndbg
    pwntools
    # Password / hash
    hashcat john
    hydra medusa
    # Forensics
    sleuthkit autopsy
    binwalk foremost scalpel
    volatility3
    # Reversing
    ghidra radare2
    strace ltrace
    # Wireless
    aircrack-ng reaver
    # Crypto
    openssl gnupg
    # Anonymity
    tor torsocks
    proxychains-ng
    # Scanners
    lynis chkrootkit rkhunter
    # Build essentials (for exploits)
    python python-pip gcc clang
    ruby
)

AUR_PACKAGES=(
    burpsuite
    exploitdb
    impacket
    bloodhound
    crackmapexec-git
    evil-winrm
    kerbrute-bin
    ligolo-ng-bin
    rustscan
    gobuster-bin
    ffuf
    nuclei-bin
)

FLATPAK_APPS=()

SERVICES_ENABLE=(
    tor
    postgresql   # for metasploit
)

SERVICES_DISABLE=(
    avahi-daemon   # reduces attack surface
)

## Hardened networking sysctl
SYSCTL_SETTINGS=(
    "net.ipv4.ip_forward=1"             # needed for MitM labs
    "net.ipv6.conf.all.forwarding=1"
    "net.ipv4.conf.all.rp_filter=0"    # allows packet spoofing in lab
    "kernel.yama.ptrace_scope=0"       # allows full ptrace for debugging
    "vm.swappiness=10"
)

ARTIC_ENV=(
    "export PYTHONPATH=\$HOME/.local/lib/python3.x/site-packages:\$PYTHONPATH"
    "export MSF_DATABASE_CONFIG=/etc/msf/database.yml"
    "alias msf='msfconsole -q'"
    "alias py='python3'"
    "alias bd='binwalk -e'"
    "alias strings2='strings -a -t x'"
)
