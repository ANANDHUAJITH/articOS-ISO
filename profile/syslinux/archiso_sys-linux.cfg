LABEL articos
TEXT HELP
Boot articOs install medium on BIOS.
It allows you to install articOs or perform system maintenance.
ENDTEXT
MENU LABEL Boot articOs (%ARCH%, BIOS, Default)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 udev.log_level=3 vt.global_cursor_default=0 cow_spacesize=5G copytoram=n nvme_load=yes lsm=landlock,lockdown,yama,integrity,apparmor,bpf

LABEL articosfree
TEXT HELP
